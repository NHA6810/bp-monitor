<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>血压记录管理</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const BAIDU_OCR_CONFIG = { apiKey: 'rA6db0H2JPOBq98twAscviwp', secretKey: 'D1rOOK7S769YZM2WMMqa0C2diBTifqoS' };
        // CORS代理：iOS Safari从GitHub Pages请求百度API时被跨域策略拦截
        const CORS_PROXY = 'https://corsproxy.io/?';
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F0EB; color: #3D2C2C; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #F4735C, #E85D4A); color: white; padding: 20px; padding-top: 50px; text-align: center; }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }
        .sync-btn { display: inline-block; margin-top: 10px; padding: 8px 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; color: white; font-size: 13px; cursor: pointer; }
        .tabs { display: flex; background: white; border-bottom: 1px solid #E8E0DA; position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 500; color: #8B7355; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab.active { color: #F4735C; border-bottom-color: #F4735C; }
        .content { padding: 16px; padding-bottom: 80px; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(244,115,92,0.08); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-date { font-size: 18px; font-weight: 700; color: #3D2C2C; }
        .card-time { font-size: 14px; color: #8B7355; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-normal { background: #E8F5E9; color: #2E7D32; }
        .status-high { background: #FFF3E0; color: #E65100; }
        .status-danger { background: #FFEBEE; color: #C62828; }
        .bp-values { display: flex; justify-content: space-around; margin: 16px 0; }
        .bp-item { text-align: center; }
        .bp-label { font-size: 12px; color: #8B7355; margin-bottom: 4px; }
        .bp-value { font-size: 28px; font-weight: 700; }
        .bp-unit { font-size: 11px; color: #8B7355; }
        .bp-systolic { color: #F4735C; }
        .bp-diastolic { color: #2A9D8F; }
        .bp-pulse { color: #E9A820; }
        .bp-diff { color: #9C27B0; }
        .card-actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 12px; border-top: 1px solid #F0EBE6; }
        .action-btn { padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; display: flex; align-items: center; gap: 4px; }
        .btn-edit { background: #FFF3E0; color: #E65100; }
        .btn-note { background: #F3E5F5; color: #7B1FA2; }
        .btn-delete { background: #FFEBEE; color: #C62828; }
        .note-display { background: #F3E5F5; padding: 10px 14px; border-radius: 10px; margin-top: 12px; font-size: 13px; color: #7B1FA2; }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 56px; height: 56px; border-radius: 50%; background: #F4735C; color: white; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 12px rgba(244,115,92,0.4); display: flex; align-items: center; justify-content: center; z-index: 200; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: flex-end; justify-content: center; }
        .modal { background: white; border-radius: 20px 20px 0 0; padding: 24px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 14px; font-weight: 600; color: #3D2C2C; margin-bottom: 6px; display: block; }
        .form-input { width: 100%; padding: 12px 16px; border: 2px solid #F0EBE6; border-radius: 12px; font-size: 16px; background: #FAF7F4; color: #3D2C2C; }
        .form-input:focus { outline: none; border-color: #F4735C; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .btn-primary { width: 100%; padding: 14px; background: #F4735C; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-secondary { width: 100%; padding: 14px; background: #F0EBE6; color: #8B7355; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .camera-area { text-align: center; padding: 30px 20px; }
        .camera-btn { padding: 16px 32px; background: #F4735C; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 10px; display: inline-block; }
        .camera-preview { max-width: 100%; border-radius: 12px; margin: 16px 0; max-height: 300px; object-fit: contain; }
        .result-card { background: #FAF7F4; border-radius: 14px; padding: 20px; margin: 16px 0; }
        .result-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F0EBE6; }
        .result-row:last-child { border-bottom: none; }
        .result-input { width: 80px; padding: 8px; border: 2px solid #F0EBE6; border-radius: 8px; font-size: 18px; font-weight: 700; text-align: center; }
        .result-input:focus { outline: none; border-color: #F4735C; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #FAF7F4; border-radius: 12px; padding: 16px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: #F4735C; }
        .stat-label { font-size: 12px; color: #8B7355; margin-top: 4px; }
        .chart-container { position: relative; height: 250px; margin: 20px 0; }
        .date-range { display: flex; gap: 12px; margin-bottom: 20px; }
        .date-range input { flex: 1; padding: 10px; border: 2px solid #F0EBE6; border-radius: 10px; font-size: 14px; }
        .export-btns { display: flex; gap: 12px; margin-top: 16px; }
        .export-btns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-email { background: #E3F2FD; color: #1565C0; }
        .btn-share { background: #E8F5E9; color: #2E7D32; }
        .empty-state { text-align: center; padding: 60px 20px; color: #8B7355; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 20px; color: #8B7355; }
        .loading-spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #F0EBE6; border-top-color: #F4735C; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .analysis-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .analysis-table th, .analysis-table td { padding: 12px; text-align: left; border-bottom: 1px solid #F0EBE6; }
        .analysis-table th { font-size: 13px; color: #8B7355; font-weight: 600; }
        .analysis-table td { font-size: 15px; color: #3D2C2C; }
        .ocr-tip { background: #FFF3E0; padding: 12px; border-radius: 10px; font-size: 13px; color: #E65100; margin: 12px 0; text-align: left; }
        .progress-bar { width: 100%; height: 6px; background: #F0EBE6; border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: #F4735C; transition: width 0.3s; border-radius: 3px; }
        .rotate-btns { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
        .rotate-btn { padding: 10px 20px; background: #F0EBE6; color: #8B7355; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        canvas#processing-canvas { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🩺 血压记录管理</h1>
        <p>记录 · 分析 · 健康</p>
        <div class="sync-btn" onclick="openSyncModal()">🔄 数据同步</div>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('list', this)"> 数据</div>
        <div class="tab" onclick="switchTab('camera', this)"> 拍照</div>
        <div class="tab" onclick="switchTab('analysis', this)">📊 分析</div>
    </div>
    <div id="tab-list" class="content"><div id="readings-list"></div><button class="fab" onclick="openAddModal()">+</button></div>
    <div id="tab-camera" class="content hidden">
        <div class="card"><div class="camera-area">
            <p style="margin-bottom:20px;color:#8B7355;">拍摄血压计照片，自动识别读数</p>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="handleImageCapture(event)">
            <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleImageCapture(event)">
            <button class="camera-btn" onclick="document.getElementById('camera-input').click()">📷 拍摄血压计</button>
            <button class="camera-btn" style="background:#2A9D8F" onclick="document.getElementById('gallery-input').click()">🖼️ 从相册选择</button>
        </div><div class="ocr-tip">💡 <strong>拍照技巧：</strong>确保光线充足，血压计数字清晰可见，尽量正对屏幕拍摄</div></div>
        <div id="camera-result" class="hidden"><div class="card">
            <img id="camera-preview" class="camera-preview" src="" alt="预览">
            <div class="rotate-btns"><button class="rotate-btn" onclick="rotateImage(-90)">↺ 左转</button><button class="rotate-btn" onclick="rotateImage(90)">↻ 右转</button><button class="rotate-btn" onclick="reOCR()">🔄 重新识别</button></div>
            <div id="ocr-progress" class="hidden"><div class="loading"><div class="loading-spinner"></div></div><p style="text-align:center;margin:10px 0;">正在识别中...</p><div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div><p id="progress-text" style="text-align:center;font-size:12px;color:#8B7355;"></p></div>
            <div id="camera-data" class="hidden"><h3 style="margin:16px 0 12px;">识别结果（可手动修改）</h3>
                <div class="result-card">
                    <div class="result-row"><span>收缩压 (高压)</span><input type="number" id="res-systolic" class="result-input bp-systolic" placeholder="120" oninput="updateResDiff()"><span style="font-size:12px;color:#8B7355">mmHg</span></div>
                    <div class="result-row"><span>舒张压 (低压)</span><input type="number" id="res-diastolic" class="result-input bp-diastolic" placeholder="80" oninput="updateResDiff()"><span style="font-size:12px;color:#8B7355">mmHg</span></div>
                    <div class="result-row" id="res-diff-row" style="display:none"><span>压差</span><span id="res-diff-value" style="font-size:18px;font-weight:700;color:#9C27B0"></span><span style="font-size:12px;color:#8B7355">mmHg</span></div>
                    <div class="result-row"><span>脉搏</span><input type="number" id="res-pulse" class="result-input bp-pulse" placeholder="72"><span style="font-size:12px;color:#8B7355">bpm</span></div>
                </div>
                <button class="btn-primary" onclick="saveCameraReading()">💾 保存记录</button><button class="btn-secondary" onclick="resetCamera()"> 重新拍照</button>
            </div>
        </div></div>
        <canvas id="processing-canvas"></canvas>
    </div>
    <div id="tab-analysis" class="content hidden">
        <div class="card"><h3 style="margin-bottom:16px;"> 选择日期范围</h3><div class="date-range"><input type="date" id="start-date" onchange="loadAnalysis()"><input type="date" id="end-date" onchange="loadAnalysis()"></div></div>
        <div id="analysis-content"></div>
    </div>
    <div id="edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal">
        <div class="modal-title" id="modal-title">新增记录</div>
        <div class="form-row"><div class="form-group"><label class="form-label">日期</label><input type="date" id="edit-date" class="form-input"></div><div class="form-group"><label class="form-label">时间</label><input type="time" id="edit-time" class="form-input"></div></div>
        <div class="form-row"><div class="form-group"><label class="form-label">收缩压 (mmHg)</label><input type="number" id="edit-systolic" class="form-input" placeholder="120" oninput="updateFormDiff()"></div><div class="form-group"><label class="form-label">舒张压 (mmHg)</label><input type="number" id="edit-diastolic" class="form-input" placeholder="80" oninput="updateFormDiff()"></div></div>
        <div class="form-group" id="form-diff-group" style="display:none"><div style="background:#F3E5F5;border-radius:10px;padding:10px 16px;text-align:center"><span style="font-size:13px;color:#7B1FA2">压差：</span><span id="form-diff-value" style="font-size:20px;font-weight:700;color:#9C27B0"></span><span style="font-size:12px;color:#7B1FA2"> mmHg</span></div></div>
        <div class="form-group"><label class="form-label">脉搏 (bpm)</label><input type="number" id="edit-pulse" class="form-input" placeholder="72"></div>
        <div class="form-group"><label class="form-label">说明（可选）</label><input type="text" id="edit-note" class="form-input" placeholder="如：晨起空腹、运动后"></div>
        <button class="btn-primary" onclick="saveReading()">保存</button><button class="btn-secondary" onclick="closeModal()">取消</button>
    </div></div>
    <div id="note-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeNoteModal()"><div class="modal">
        <div class="modal-title"> 测量说明</div>
        <div class="form-group"><label class="form-label">记录测量时的具体情况</label><input type="text" id="note-text" class="form-input" placeholder="如：晨起空腹、早餐后、运动后、服药后..."></div>
        <p style="font-size:12px;color:#8B7355;margin-bottom:16px;">💡 记录测量时的状态有助于医生更准确地评估您的血压情况</p>
        <button class="btn-primary" onclick="saveNote()">保存</button><button class="btn-secondary" onclick="closeNoteModal()">取消</button>
    </div></div>
    <div id="sync-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeSyncModal()"><div class="modal">
        <div class="modal-title"> 数据同步</div>
        <div class="form-group"><label class="form-label">GitHub Token</label><input type="password" id="github-token" class="form-input" placeholder="ghp_xxxxxxxxxxxx"></div>
        <p style="font-size:12px;color:#8B7355;margin-bottom:16px;">💡 Token 用于访问 GitHub 仓库，不会上传到任何服务器</p>
        <button class="btn-primary" onclick="syncToGitHub()" style="margin-bottom:10px;">⬆️ 上传到 GitHub</button>
        <button class="btn-primary" onclick="syncFromGitHub()" style="background:#2A9D8F;margin-bottom:10px;">⬇️ 从 GitHub 恢复</button>
        <button class="btn-secondary" onclick="closeSyncModal()">取消</button>
    </div></div>
    <script>
        let readings = [];
        let editingId = null, noteItemId = null, chartInstance = null, currentRotation = 0, currentImageData = null;

        async function loadOriginalData() {
            try {
                const resp = await fetch('data.json');
                if (resp.ok) { const data = await resp.json(); if (data.length > 0) { readings = data; localStorage.setItem('bp_readings', JSON.stringify(readings)); localStorage.setItem('bp_data_version', '1.0'); return true; } }
            } catch (e) { console.error('加载原始数据失败:', e); }
            return false;
        }

        async function init() {
            const savedData = localStorage.getItem('bp_readings');
            if (savedData) {
                // 本地有数据，优先使用本地数据
                readings = JSON.parse(savedData);
            } else {
                // 本地没有数据，从 GitHub 加载原始数据
                const loaded = await loadOriginalData();
                if (!loaded) readings = [];
            }
            renderList();
            const now = new Date(); const today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0'); const weekAgoDate = new Date(now.getTime() - 7*24*60*60*1000); const weekAgo = weekAgoDate.getFullYear() + '-' + String(weekAgoDate.getMonth()+1).padStart(2,'0') + '-' + String(weekAgoDate.getDate()).padStart(2,'0');
            document.getElementById('start-date').value = weekAgo;
            document.getElementById('end-date').value = today;
        }

        function saveData() { localStorage.setItem('bp_readings', JSON.stringify(readings)); localStorage.setItem('bp_data_version', '1.0'); }
        function switchTab(tab, el) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.content').forEach(c => c.classList.add('hidden')); el.classList.add('active'); document.getElementById('tab-' + tab).classList.remove('hidden'); if (tab === 'analysis') loadAnalysis(); }
        function getStatus(s, d) { if (s >= 140 || d >= 90) return { label: '偏高', class: 'status-danger' }; if (s >= 130 || d >= 85) return { label: '正常高值', class: 'status-high' }; return { label: '正常', class: 'status-normal' }; }

        function renderList() {
            const list = document.getElementById('readings-list');
            const sorted = [...readings].sort((a, b) => b.record_date.localeCompare(a.record_date) || b.record_time.localeCompare(a.record_time));
            if (sorted.length === 0) { list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无记录</p></div>'; return; }
            list.innerHTML = sorted.map(r => { const status = getStatus(r.systolic, r.diastolic); return `<div class="card"><div class="card-header"><div><div class="card-date">${r.record_date}</div><div class="card-time">${r.record_time}</div></div><span class="status-badge ${status.class}">${status.label}</span></div><div class="bp-values"><div class="bp-item"><div class="bp-label">收缩压</div><div class="bp-value bp-systolic">${r.systolic}</div><div class="bp-unit">mmHg</div></div><div class="bp-item"><div class="bp-label">舒张压</div><div class="bp-value bp-diastolic">${r.diastolic}</div><div class="bp-unit">mmHg</div></div><div class="bp-item"><div class="bp-label">压差</div><div class="bp-value bp-diff">${r.systolic - r.diastolic}</div><div class="bp-unit">mmHg</div></div><div class="bp-item"><div class="bp-label">脉搏</div><div class="bp-value bp-pulse">${r.pulse}</div><div class="bp-unit">bpm</div></div></div>${r.note ? `<div class="note-display">📝 ${r.note}</div>` : ''}<div class="card-actions"><button class="action-btn btn-edit" onclick="openEditModal(${r.id})">✏️ 编辑</button><button class="action-btn btn-note" onclick="openNoteModal(${r.id})">📝 说明</button><button class="action-btn btn-delete" onclick="deleteReading(${r.id})">🗑️ 删除</button></div></div>`; }).join('');
        }

        function openAddModal() { editingId = null; document.getElementById('modal-title').textContent = '新增记录'; const now = new Date(); document.getElementById('edit-date').value = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0'); document.getElementById('edit-time').value = now.toTimeString().slice(0, 5); document.getElementById('edit-systolic').value = ''; document.getElementById('edit-diastolic').value = ''; document.getElementById('edit-pulse').value = ''; document.getElementById('edit-note').value = ''; document.getElementById('edit-modal').classList.remove('hidden'); }
        function openEditModal(id) { const r = readings.find(x => x.id === id); if (!r) return; editingId = id; document.getElementById('modal-title').textContent = '编辑记录'; document.getElementById('edit-date').value = r.record_date; document.getElementById('edit-time').value = r.record_time; document.getElementById('edit-systolic').value = r.systolic; document.getElementById('edit-diastolic').value = r.diastolic; document.getElementById('edit-pulse').value = r.pulse; document.getElementById('edit-note').value = r.note || ''; document.getElementById('edit-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('edit-modal').classList.add('hidden'); }
        function saveReading() { const date = document.getElementById('edit-date').value; const time = document.getElementById('edit-time').value; const systolic = parseInt(document.getElementById('edit-systolic').value); const diastolic = parseInt(document.getElementById('edit-diastolic').value); const pulse = parseInt(document.getElementById('edit-pulse').value); const note = document.getElementById('edit-note').value; if (!date || !time || !systolic || !diastolic || !pulse) { alert('请填写完整数据'); return; } if (editingId) { const idx = readings.findIndex(x => x.id === editingId); if (idx >= 0) readings[idx] = { ...readings[idx], record_date: date, record_time: time, systolic, diastolic, pulse, note }; } else { const maxId = readings.reduce((max, r) => Math.max(max, r.id), 0); readings.push({ id: maxId + 1, record_date: date, record_time: time, systolic, diastolic, pulse, note }); } saveData(); renderList(); closeModal(); }
        function openNoteModal(id) { noteItemId = id; const r = readings.find(x => x.id === id); document.getElementById('note-text').value = r?.note || ''; document.getElementById('note-modal').classList.remove('hidden'); }
        function closeNoteModal() { document.getElementById('note-modal').classList.add('hidden'); }
        function updateResDiff() { const s = parseInt(document.getElementById('res-systolic').value); const d = parseInt(document.getElementById('res-diastolic').value); const row = document.getElementById('res-diff-row'); if (s && d) { document.getElementById('res-diff-value').textContent = s - d; row.style.display = 'flex'; } else { row.style.display = 'none'; } }
        function updateFormDiff() { const s = parseInt(document.getElementById('edit-systolic').value); const d = parseInt(document.getElementById('edit-diastolic').value); const group = document.getElementById('form-diff-group'); if (s && d) { document.getElementById('form-diff-value').textContent = s - d; group.style.display = 'block'; } else { group.style.display = 'none'; } }
        function saveNote() { const idx = readings.findIndex(x => x.id === noteItemId); if (idx >= 0) { readings[idx].note = document.getElementById('note-text').value; saveData(); renderList(); } closeNoteModal(); }
        function deleteReading(id) { if (!confirm('确定要删除这条记录吗？')) return; readings = readings.filter(x => x.id !== id); saveData(); renderList(); }

        function parseBPFromText(text) {
            let systolic = null, diastolic = null, pulse = null;

            // 先从原文提取mmHg附近的数字（在字符替换前，避免mmHg被破坏）
            let mmHgVals = [];
            const origMmHgBefore = [...text.matchAll(/(\d{2,3})\s*(?:mmHg|mmhg)/gi)];
            const origMmHgAfter = [...text.matchAll(/(?:mmHg|mmhg)\s*(\d{2,3})/gi)];
            origMmHgBefore.forEach(m => mmHgVals.push(parseInt(m[1])));
            origMmHgAfter.forEach(m => mmHgVals.push(parseInt(m[1])));
            mmHgVals = [...new Set(mmHgVals)];

            // 清理OCR常见误识别（字母→数字）
            const cleaned = text.replace(/[oO]/g, '0').replace(/[lI|]/g, '1').replace(/[sS]/g, '5').replace(/[bB]/g, '6').replace(/[gG]/g, '9').replace(/[zZ]/g, '2');

            // 模式1: SYS/DIA/PUL 标签
            const sysMatch = cleaned.match(/(?:SYS|收缩压|高压)[\s:：]*(\d{2,3})/i);
            const diaMatch = cleaned.match(/(?:DIA|舒张压|低压)[\s:：]*(\d{2,3})/i);
            const pulMatch = cleaned.match(/(?:PUL|脉搏|心率| pulse)[\s:：]*(\d{2,3})/i);
            if (sysMatch) systolic = parseInt(sysMatch[1]);
            if (diaMatch) diastolic = parseInt(diaMatch[1]);
            if (pulMatch) pulse = parseInt(pulMatch[1]);

            // 模式2: 斜杠格式 120/80
            if (!systolic || !diastolic) {
                const slashMatch = cleaned.match(/(\d{2,3})\s*[\/／]\s*(\d{2,3})/);
                if (slashMatch) {
                    const a = parseInt(slashMatch[1]), b = parseInt(slashMatch[2]);
                    if (a > b) { if (!systolic) systolic = a; if (!diastolic) diastolic = b; }
                    else { if (!systolic) systolic = b; if (!diastolic) diastolic = a; }
                }
            }

            // 模式3: mmHg 单位附近的数字（使用预提取结果，避免字符替换破坏mmHg）
            if (!systolic || !diastolic) {
                const mmHgMatches = mmHgVals.map(v => ({1: String(v)}));
                if (mmHgMatches.length >= 2) {
                    const vals = mmHgMatches.map(m => parseInt(m[1]));
                    if (!systolic) systolic = Math.max(...vals);
                    if (!diastolic) diastolic = Math.min(...vals);
                } else if (mmHgMatches.length === 1) {
                    const val = parseInt(mmHgMatches[0][1]);
                    if (!systolic && val > 80) systolic = val;
                    else if (!diastolic && val <= 80) diastolic = val;
                }
            }

            // 模式4: 提取所有数字，按大小推断
            const allNumbers = cleaned.match(/\d{2,3}/g);
            if (allNumbers) {
                const nums = allNumbers.map(n => parseInt(n)).filter(n => n >= 40 && n <= 250);
                const unique = [...new Set(nums)];
                if (unique.length >= 2 && (!systolic || !diastolic)) {
                    const sorted = [...unique].sort((a, b) => b - a);
                    if (!systolic) systolic = sorted[0];
                    if (!diastolic) diastolic = sorted.find(n => n < systolic && n >= 40) || sorted[1];
                }
                if (!pulse) {
                    const pulseCandidates = unique.filter(n => n >= 40 && n <= 130 && n !== systolic && n !== diastolic);
                    if (pulseCandidates.length > 0) pulse = pulseCandidates[0];
                }
            }

            // 范围校验
            if (systolic && (systolic < 60 || systolic > 260)) systolic = null;
            if (diastolic && (diastolic < 30 || diastolic > 180)) diastolic = null;
            if (pulse && (pulse < 30 || pulse > 220)) pulse = null;
            if (systolic && diastolic && systolic < diastolic) {
                const tmp = systolic; systolic = diastolic; diastolic = tmp;
            }

            return { systolic, diastolic, pulse };
        }

        function preprocessImage(imageDataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const scale = Math.min(2.5, 1200 / Math.min(img.width, img.height));
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const d = imageData.data;
                    for (let i = 0; i < d.length; i += 4) {
                        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                        // 二值化(阈值100)：更适合LCD数码管，避免对比度增强丢失细笔画
                        const v = gray > 100 ? 255 : 0;
                        d[i] = d[i+1] = d[i+2] = v;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', 0.92));
                };
                img.src = imageDataUrl;
            });
        }

        // 轻量压缩：把大图压缩到最长边≤1200px，JPEG质量0.9，避免iPhone大图撑爆请求体
        function compressForOCR(imageDataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1200;
                    let w = img.width, h = img.height;
                    if (Math.max(w, h) <= maxDim) { resolve(imageDataUrl); return; }
                    const scale = maxDim / Math.max(w, h);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(w * scale);
                    canvas.height = Math.round(h * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                img.src = imageDataUrl;
            });
        }

        async function doOCR(imageDataUrl, rotation) {
            document.getElementById('progress-text').textContent = '正在预处理图片...';
            document.getElementById('progress-fill').style.width = '15%';
            try {
                const processedImage = await preprocessImage(imageDataUrl);
                document.getElementById('progress-text').textContent = '正在获取识别令牌...';
                document.getElementById('progress-fill').style.width = '25%';
                const tokenUrl = CORS_PROXY + `https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${BAIDU_OCR_CONFIG.apiKey}&client_secret=${BAIDU_OCR_CONFIG.secretKey}`;
                const tokenResp = await fetch(tokenUrl, { method: 'GET' });
                const tokenData = await tokenResp.json();
                if (!tokenData.access_token) throw new Error('获取令牌失败');

                const base64Processed = processedImage.split(',')[1];
                const compressedImage = await compressForOCR(imageDataUrl);
                const base64Original = compressedImage.split(',')[1];
                let bestParsed = { systolic: null, diastolic: null, pulse: null };

                // 尝试1：高精度接口 + 原始图
                if (!bestParsed.systolic) {
                    document.getElementById('progress-text').textContent = '正在识别数字(1/3)...';
                    document.getElementById('progress-fill').style.width = '45%';
                    try {
                        const ocrUrl = CORS_PROXY + `https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic?access_token=${tokenData.access_token}`;
                        const ocrResp = await fetch(ocrUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `image=${encodeURIComponent(base64Original)}&language_type=CHN_ENG&detect_direction=true` });
                        const ocrData = await ocrResp.json();
                        if (ocrData.words_result) {
                            const text = ocrData.words_result.map(item => item.words).join('\n');
                            console.log('高精度OCR(原始图):', text);
                            const parsed = parseBPFromText(text);
                            if (parsed.systolic && parsed.diastolic) { bestParsed = parsed; }
                        }
                    } catch (e) { console.warn('原始图OCR失败:', e.message || e); }
                }

                // 尝试2：高精度接口 + 预处理图
                if (!bestParsed.systolic) {
                    document.getElementById('progress-text').textContent = '正在识别数字(2/3)...';
                    document.getElementById('progress-fill').style.width = '65%';
                    try {
                        const ocrUrl = CORS_PROXY + `https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic?access_token=${tokenData.access_token}`;
                        const ocrResp = await fetch(ocrUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `image=${encodeURIComponent(base64Processed)}&language_type=CHN_ENG&detect_direction=true` });
                        const ocrData = await ocrResp.json();
                        if (ocrData.words_result) {
                            const text = ocrData.words_result.map(item => item.words).join('\n');
                            console.log('高精度OCR(预处理):', text);
                            const parsed = parseBPFromText(text);
                            if (parsed.systolic && parsed.diastolic) { bestParsed = parsed; }
                        }
                    } catch (e) { console.warn('高精度OCR(预处理)失败:', e.message || e); }
                }

                // 尝试3：数字识别接口（兜底） + 预处理图
                document.getElementById('progress-text').textContent = '正在识别数字(3/3)...';
                document.getElementById('progress-fill').style.width = '85%';
                try {
                    const ocrUrl = CORS_PROXY + `https://aip.baidubce.com/rest/2.0/ocr/v1/numbers?access_token=${tokenData.access_token}`;
                    const ocrResp = await fetch(ocrUrl, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `image=${encodeURIComponent(base64Processed)}&detect_direction=true` });
                    const ocrData = await ocrResp.json();
                    if (ocrData.words_result) {
                        const text = ocrData.words_result.map(item => item.words).join('\n');
                        console.log('数字OCR(预处理):', text);
                        const parsed = parseBPFromText(text);
                        if (parsed.systolic && parsed.diastolic) { bestParsed = parsed; }
                    }
                } catch (e) { console.warn('数字OCR失败:', e.message || e); }

                document.getElementById('progress-fill').style.width = '100%';
                if (bestParsed.systolic || bestParsed.diastolic) {
                    showOCRResult(bestParsed);
                } else {
                    throw new Error('未能从图片中识别出血压数据，请确保屏幕数字清晰可见');
                }
            } catch (err) {
                console.error('OCR 错误:', err);
                alert('⚠️ 识别失败：' + (err.message || '网络连接失败，请检查网络后重试'));
                showOCRResult({ systolic: null, diastolic: null, pulse: null });
            }
        }

        async function syncToGitHub() {
            const token = document.getElementById('github-token').value.trim();
            if (!token) { alert('请输入 GitHub Token'); return; }
            localStorage.setItem('github_token', token);
            try {
                const resp = await fetch('https://api.github.com/repos/NHA6810/bp-monitor/contents/data.json', {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                const data = await resp.json();
                const sha = data.sha;

                // 数据相同时跳过上传
                try {
                    const remoteContent = decodeURIComponent(escape(atob(data.content)));
                    const remoteData = JSON.parse(remoteContent);
                    if (JSON.stringify(readings) === JSON.stringify(remoteData)) {
                        alert('ℹ️ 数据与 GitHub 一致，无需上传');
                        closeSyncModal();
                        return;
                    }
                } catch (e) { /* 比较失败则继续上传 */ }

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(readings, null, 2))));
                const updateResp = await fetch('https://api.github.com/repos/NHA6810/bp-monitor/contents/data.json', {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ message: 'sync: 从手机同步数据 ' + new Date().toISOString(), content, sha })
                });
                if (updateResp.ok) {
                    alert('✅ 数据已成功上传到 GitHub！');
                    closeSyncModal();
                } else {
                    const err = await updateResp.json();
                    alert(' 上传失败：' + (err.message || '未知错误'));
                }
            } catch (err) {
                alert('❌ 同步失败：' + err.message);
            }
        }

        async function syncFromGitHub() { const token = document.getElementById('github-token').value.trim(); if (!token) { alert('请输入 GitHub Token'); return; } localStorage.setItem('github_token', token); try { const resp = await fetch('https://api.github.com/repos/NHA6810/bp-monitor/contents/data.json', { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' } }); const data = await resp.json(); const content = decodeURIComponent(escape(atob(data.content))); readings = JSON.parse(content); saveData(); renderList(); alert('✅ 数据已从 GitHub 恢复！共 ' + readings.length + ' 条记录'); closeSyncModal(); } catch (err) { alert('❌ 恢复失败：' + err.message); } }

        init();
    </script>
</body>
</html>
